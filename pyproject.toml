[project]
name = "life-simulator"
version = "0.2.0"
description = "Data-grounded life decision simulator"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.40.0",
    "openai>=1.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
web = [
    "streamlit>=1.30",
    "pandas>=2.0",
]
dev = [
    "pytest>=8.0",
    "ruff",
]

[project.scripts]
lifesim = "life_simulator.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
